<text x="52" y="249" font-family="Montserrat, Arial, sans-serif" font-size="21" font-weight="600" fill="#101010" dominant-baseline="text-before-edge">de la cartera priorizada</text>
<text x="52" y="289" font-family="Montserrat, Arial, sans-serif" font-size="21" font-weight="400" fill="#666666" dominant-baseline="text-before-edge">concentra 223 de 739</text>
