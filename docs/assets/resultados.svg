<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="440" viewBox="0 0 1600 440" role="img">
<rect width="1600" height="440" fill="#F5F5F5"/>
<text x="52" y="34" font-family="Montserrat, Arial, sans-serif" font-size="22" font-weight="600" fill="#101010" dominant-baseline="text-before-edge">EL RESULTADO, EN CUATRO CIFRAS</text>
<text x="52" y="80" font-family="Montserrat, Arial, sans-serif" font-size="24" font-weight="400" fill="#666666" dominant-baseline="text-before-edge">Evidencia histórica agregada de la tesis</text>
